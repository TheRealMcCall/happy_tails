{% extends "base.html" %}
{% block content %}
<section class="container my-4">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="mb-0">My Wishlist</h1>
        <a class="btn btn-outline-secondary" href="{% url 'store:home' %}" aria-label="Go back to shop">Logout</a>>Back
        to shop</a>
    </div>

    {% if products %}
    <div class="table-responsive mt-3">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Product</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for p in products %}
                <tr>
                    <td>
                        <a href="{% url 'store:product_detail' p.slug %}">{{ p.name }}</a>
                    </td>
                    <td class="text-end">
                        <form method="post" action="{% url 'store:wishlist_toggle' p.id %}" class="d-inline">
                            {% csrf_token %}
                            <input type="hidden" name="next" value="{% url 'store:wishlist' %}">
                            <button class="btn btn-sm btn-outline-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <p class="mt-3">Your wishlist is empty.</p>
    <a class="btn btn-primary" href="{% url 'store:product_list' %}" aria-label="Go to products page">Logout</a>>Browse
    products</a>
    {% endif %}
</section>
{% endblock %}
