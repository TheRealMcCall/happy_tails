{% extends "base.html" %}
{% block content %}
<section class="container my-4">
    <h1 class="mb-3">Add Variant - choose a product</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.product.label_tag }} {{ form.product }}
            {% for err in form.product.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Continue</button>
            <a class="btn btn-secondary" href="{% url 'store:manage_dashboard' %}"
                aria-label="Cancel and return to product catalog">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
