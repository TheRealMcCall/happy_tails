{% extends "base.html" %}
{% block content %}
<section class="container my-4">
    <h1 class="mb-3">Delete “{{ product.name }}”?</h1>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button class="btn btn-danger" type="submit">Yes, delete</button>
            <a class="btn btn-secondary" href="{% url 'store:manage_dashboard' %}"
                aria-label="Cancel and go back to product catalog">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
