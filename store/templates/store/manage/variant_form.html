{% extends "base.html" %}
{% block content %}
<div class="container my-4">
    <h2 class="h4 mb-3">Add Variant - {{ product.name }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
        <div class="mb-3">
            {{ field.label_tag }} {{ field }}
            {% for err in field.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
        </div>
        {% endfor %}

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Add Variant</button>
            <a class="btn btn-outline-secondary" href="{% url 'store:manage_dashboard' %}">Back</a>
        </div>
    </form>
</div>
{% endblock %}
