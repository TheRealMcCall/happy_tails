{% extends "base.html" %}
{% block content %}
<section class="container my-4">

    <nav class="mb-3" aria-label ="Product Management menu">
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'manage_dashboard' %}active{% endif %}"
                    href="{% url 'store:manage_dashboard' %}">Product Catalog</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'manage_variants' %}active{% endif %}"
                    href="{% url 'store:manage_variants' %}">Variant Catalog</a>
            </li>
        </ul>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Product Catalog</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" href="{% url 'store:product_create' %}">Add product</a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th class="text-end">Modify Product</th>
                </tr>
            </thead>
            <tbody>
                {% for p in products %}
                <tr>
                    <td>{{ p.name }}</td>
                    <td>{{ p.category }}</td>
                    <td class="text-end d-flex gap-2 justify-content-end">
                        <a class="btn btn-sm btn-outline-secondary" href="{% url 'store:product_edit' p.id %}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" href="{% url 'store:product_delete' p.id %}">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-muted">No products yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
