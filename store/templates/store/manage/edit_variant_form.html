{% extends "base.html" %}
{% block content %}
<div class="container my-4">
    <h2 class="mb-3">{% if is_create %}Add Variant{% else %}Edit Variant: {{ variant.sku }}{% endif %}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for err in field.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save changes</button>
            <a class="btn btn-outline-secondary" href="{% url 'store:manage_variants' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
