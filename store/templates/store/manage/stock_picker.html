{% extends "base.html" %}
{% block content %}
<div class="container my-4">
    <h2 class="h5 mb-3">Add/Remove Stock - choose a product</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.product.label_tag }} {{ form.product }}
            {% for err in form.product.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Continue</button>
            <a class="btn btn-outline-secondary" href="{% url 'store:manage_dashboard' %}">Back</a>
        </div>
    </form>
</div>
{% endblock %}
