{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<section class="container form-container my-4">
    <h1 class="text-center">{{ title }}</h1>

    <div class="row mt-3">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5 mx-auto">
            <form method="post" class="mt-3">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex gap-4">
                    <button class="btn btn-success" type="submit">Save</button>
                    <a class="btn btn-secondary" href="{% url 'profiles:profile' %}" aria-label="cancel and go back to profile page">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
