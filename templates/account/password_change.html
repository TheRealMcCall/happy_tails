{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<section class="container py-5 form-container">
    <h1 class="text-center mb-4">Change Password</h1>

    <form method="post" action="{% url 'account_change_password' %}">
        {% csrf_token %}

        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto">
            {{ form|crispy }}

            <div class="d-flex gap-2 mt-3">
                <a href="{% url 'profiles:profile' %}" class="btn btn-outline-secondary"
                    aria-label="Back to your profile">Back to Profile</a>
                <button type="submit" class="btn btn-primary">Change Password</button>

            </div>
        </div>
    </form>
</section>
{% endblock %}
