{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<section class="container py-5 form-container">
    <h1 class="text-center mb-4">Reset your password</h1>
    <p class="text-center mb-4">Enter your account email and we’ll send a reset link.</p>

    <form method="post" action="{% url 'account_reset_password' %}">
        {% csrf_token %}
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto">
            {{ form|crispy }}
            <div class="d-flex gap-2 mt-3">
                <a href="{% url 'account_login' %}" class="btn btn-outline-secondary">Back to sign in</a>
                <button type="submit" class="btn btn-primary">Send reset link</button>

            </div>
        </div>
    </form>
</section>
{% endblock %}
